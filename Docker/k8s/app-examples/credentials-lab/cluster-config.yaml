kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  apiServerAddress: "$MY_PRIVATE_IP"
  apiServerPort: 6443
  ipFamily: dual
  podSubnet: "10.244.0.0/16,fd00:10:244::/56"
  serviceSubnet: "10.96.0.0/12,fd00:10:96::/112"
  kubeProxyMode: iptables
kubeadmConfigPatches:
- |-
  kind: ClusterConfiguration
  apiServer:
    extraArgs:
      "enable-admission-plugins": "NamespaceLifecycle,LimitRanger,ServiceAccount,TaintNodesByCondition,Priority,DefaultTolerationSeconds,DefaultStorageClass,PersistentVolumeClaimResize,MutatingAdmissionWebhook,ValidatingAdmissionWebhook,ResourceQuota,NodeRestriction"
  controllerManager:
    extraArgs:
      bind-address: "::"
  etcd:
    local:
      extraArgs:
        listen-metrics-urls: "http://[::]:2381"
  scheduler:
    extraArgs:
      bind-address: "::"
- |-
  kind: KubeProxyConfiguration
  metricsBindAddress: "::"
nodes:
- role: control-plane
  extraPortMappings:
  - containerPort: 31437
    hostPort: 80
    protocol: TCP
    listenAddress: "0.0.0.0"
  - containerPort: 31438
    hostPort: 443
    protocol: TCP
    listenAddress: "0.0.0.0"
  - containerPort: 31437
    hostPort: 8080
    protocol: TCP
    listenAddress: "::"
  - containerPort: 31438
    hostPort: 8443
    protocol: TCP
    listenAddress: "::"
  kubeadmConfigPatches:
  - |
    kind: InitConfiguration
    skipPhases:
      - mark-control-plane
- role: worker
- role: worker
