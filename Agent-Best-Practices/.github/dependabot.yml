# Automated dependency updates (GitHub-native). Backs .agent/standards/dependencies.md.
# Enable the ecosystems your repo actually uses and delete the rest.
# Renovate is a drop-in alternative with more grouping control — pick one, not both.
version: 2
updates:
  # GitHub Actions used by the workflows in this repo.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]

